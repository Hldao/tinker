# Tinker · NAS 私有实例 (团队私人工作台)
#
# 跟公网 ECS 那套 (docker-compose.yml) 完全分开:
#   - 复用同一个 Dockerfile · 不改 ECS 的部署链路
#   - 独立数据卷 ./data-nas · 库不跟 ECS 混
#   - 把 NAS 的同步文件夹挂进来 (/data/files) · 服务能直接读/服务文件
#     → 投递日志的链接点开就是 NAS 上的原件 · 零重复存储 · 全程私密
#   - 带 DeepSeek key · 调研压缩 + LLM 归档在本地私密跑 · 连公网都不出
#
# 在绿联 UGOS 上跑:
#   1. 把这个仓库弄到 NAS 上 (git clone · 见 NAS 部署说明)
#   2. 复制 .env.nas.example 为 .env.nas · 填 DEEPSEEK_API_KEY 和 NAS_FILES_DIR
#   3. docker compose --env-file .env.nas -f docker-compose.nas.yml up -d --build

services:
  tinker-nas:
    build: .
    image: tinker-nas:latest
    container_name: tinker-nas
    restart: unless-stopped
    ports:
      - "${PORT:-8788}:8788"
    environment:
      NODE_ENV: production
      PORT: 8788
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 私有实例 · CORS 留空=只同源 · BASE_URL 填队友访问用的地址 (比如 http://<nas-tailnet-ip>:8788)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BASE_URL: ${BASE_URL:-}
      DB_FILE: /data/tinker.db
      DATA_FILE: /data/data.json
      # 服务端压缩/归档用 (只这个私有实例碰模型)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # 登录走邮箱 magic link · 要队友能登录就填 SMTP (不填则只能靠已有 session/token)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - ./data-nas:/data                                   # 私有实例的库 · 跟 ECS 分开
      - ./webapp:/app/webapp:ro                            # 改网页只 restart 不 rebuild
      - ./.git:/app/.gitdir:ro                             # /api/cli-version 读它
      # NAS 同步文件夹挂进来 (只读) · 服务读它做投递日志 + 点开原件
      # NAS_FILES_DIR 填绿联上"哇咔咔"那个共享文件夹的实际路径
      - ${NAS_FILES_DIR:-./nas-files}:/data/files:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8788/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
